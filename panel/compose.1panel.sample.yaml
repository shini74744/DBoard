# Deployment for 1Panel users.
#
# 1Panel runs MySQL/Redis as separate containers on a Docker network named
# `1panel-network`. To let Xboard reach them by their container hostname
# (e.g. `1Panel-mysql-xxxx`), this compose file joins that external network
# in addition to publishing port 7001 for 1Panel's reverse proxy / website.
#
# During `php artisan xboard:install`, set:
#   - Database Host: the container name shown in 1Panel under
#                    Database -> Connection Info -> Host
#   - Redis: choose the built-in Redis (already provided by this image)
services:
  xboard:
    image: ghcr.io/cedar2025/xboard:latest
    restart: unless-stopped
    ports:
      - "7001:7001"
    networks:
      - default
      - 1panel-network
    volumes:
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/.env:/www/.env
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/data:/www/.docker/.data
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/logs:/www/storage/logs
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/theme:/www/storage/theme
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/app:/www/storage/app
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/backup:/www/storage/backup
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/public-theme:/www/public/theme
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/plugins:/www/plugins
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/redis:/data
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - docker=true

networks:
  1panel-network:
    external: true

