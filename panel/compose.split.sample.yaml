# Advanced split deployment.
# The same DBoard image is reused for each application role.
# Redis is pinned to 8.4.2 so the RDB format stays compatible with the
# standalone/native deployment.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "7001:7001"
    depends_on:
      - web
      - ws-server
    volumes:
      - ./.docker/caddy/Caddyfile.split:/etc/caddy/Caddyfile:ro

  web:
    image: ghcr.io/shini74744/dboard:latest
    restart: unless-stopped
    depends_on:
      - redis
    volumes: &shared-volumes
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/.env:/www/.env
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/data:/www/.docker/.data
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/logs:/www/storage/logs
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/theme:/www/storage/theme
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/app:/www/storage/app
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/storage/backup:/www/storage/backup
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/public-theme:/www/public/theme
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/plugins:/www/plugins
    environment: &external-redis-env
      docker: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ENABLE_REDIS: "false"
      ENABLE_CADDY: "false"
      ENABLE_SCHEDULER: "false"
      ENABLE_HORIZON: "false"
      ENABLE_WS_SERVER: "false"

  horizon:
    image: ghcr.io/shini74744/dboard:latest
    restart: unless-stopped
    depends_on:
      - redis
    volumes: *shared-volumes
    environment:
      <<: *external-redis-env
      ENABLE_WEB: "false"
      ENABLE_HORIZON: "true"

  ws-server:
    image: ghcr.io/shini74744/dboard:latest
    restart: unless-stopped
    depends_on:
      - redis
    volumes: *shared-volumes
    environment:
      <<: *external-redis-env
      ENABLE_WEB: "false"
      ENABLE_WS_SERVER: "true"
      WS_HOST: "0.0.0.0"
  scheduler:
    image: ghcr.io/shini74744/dboard:latest
    restart: unless-stopped
    depends_on:
      - redis
    volumes: *shared-volumes
    environment:
      <<: *external-redis-env
      ENABLE_WEB: "false"
      ENABLE_SCHEDULER: "true"

  redis:
    image: redis:8.4.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --save
      - "60"
      - "10000"
    volumes:
      - ${DBOARD_DATA_DIR:-/opt/dboard/shared}/redis:/data
